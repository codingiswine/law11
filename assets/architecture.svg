  <rect x="100" y="310" width="480" height="230" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="335" font-size="13.5" font-weight="700" fill="#1e40af">law_rag_tool — 3단 계층 검색</text>

  <rect x="120" y="350" width="440" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="340" y="378" text-anchor="middle" font-size="12.5" fill="#0f172a">① PostgreSQL 정확 매칭 (법령명+조문번호)</text>

  <line x1="340" y1="396" x2="340" y2="410" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="450" y="405" font-size="10.5" fill="#64748b">실패 시 ↓</text>

  <rect x="120" y="410" width="440" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="340" y="438" text-anchor="middle" font-size="12.5" fill="#0f172a">② Qdrant 벡터 검색 (임계값 0.45 / 0.5)</text>

  <line x1="340" y1="456" x2="340" y2="470" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="450" y="465" font-size="10.5" fill="#64748b">실패 시 ↓</text>

  <rect x="120" y="470" width="440" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="340" y="498" text-anchor="middle" font-size="12.5" fill="#0f172a">③ Web Search Fallback (Tavily / Naver)</text>

