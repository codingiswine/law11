  <text x="640" y="365" font-size="12" fill="#334155">· db_query_tool_async</text>
  <text x="640" y="390" font-size="12" fill="#334155">  (session_id 격리)</text>
  <text x="640" y="415" font-size="12" fill="#334155">· news_tool</text>
  <text x="640" y="440" font-size="12" fill="#334155">· blog_tool</text>
  <text x="640" y="465" font-size="12" fill="#334155">· websearch_tool</text>
  <text x="640" y="490" font-size="12" fill="#334155">· general_tool</text>

  <line x1="700" y1="250" x2="340" y2="310" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="700" y1="250" x2="730" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

