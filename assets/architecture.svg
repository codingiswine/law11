  <text x="200" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="200" y="704" text-anchor="middle" font-size="11" fill="#64748b">law_chunks · chat_history</text>

  <rect x="330" y="660" width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Qdrant</text>
  <text x="430" y="704" text-anchor="middle" font-size="11" fill="#64748b">laws 컬렉션 (벡터)</text>

  <rect x="560" y="660" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="660" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">OpenAI API</text>
  <text x="660" y="704" text-anchor="middle" font-size="11" fill="#64748b">GPT-4o mini</text>

  <rect x="790" y="660" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="890" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Tavily / Naver</text>
  <text x="890" y="704" text-anchor="middle" font-size="11" fill="#64748b">웹 검색 (세마포어 제한)</text>

  <line x1="200" y1="540" x2="200" y2="660" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="430" y1="540" x2="430" y2="660" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="660" y1="540" x2="660" y2="660" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="890" y1="540" x2="890" y2="660" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

