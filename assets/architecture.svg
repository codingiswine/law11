  <text x="90" y="855" font-size="12.5" fill="#166534">GitHub Actions CI → pytest 58개 · RAGAS 회귀 하니스(5% 하락 시 실패 처리) · 멀티턴 회귀 eval · 부하테스트(20명 무결함) · 장애 주입 테스트(의존성 5종)</text>
  <text x="90" y="876" font-size="12" fill="#166534">→ changelog 35건 기록, 결함 21건 근본원인 분석·수정</text>
