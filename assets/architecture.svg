<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Law11 — 전체 아키텍처</text>

  <!-- Client -->
  <rect x="580" y="65" width="240" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="700" y="98" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0f172a">Client — React + TypeScript (SSE)</text>

  <!-- FastAPI backend outer box -->
  <rect x="60" y="150" width="1280" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
