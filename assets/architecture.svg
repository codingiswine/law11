  <line x1="700" y1="120" x2="700" y2="150" stroke="#64748b" stroke-width="1.8" marker-end="url(#a1)"/>

  <!-- question_router -->
  <rect x="600" y="195" width="200" height="55" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="700" y="219" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">question_router</text>
  <text x="700" y="237" text-anchor="middle" font-size="11" fill="#64748b">detect_tool() → ToolPlan</text>

