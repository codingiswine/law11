# 보안 응답 헤더 (#91). nginx의 add_header는 location에 하나라도 있으면 상위 것을 상속하지 않으므로
# (Cache-Control을 거는 location이 둘 있다) 이 파일을 server와 그 location들에서 각각 include 한다.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Vite 번들은 자체 스크립트만 쓴다. React의 style={{}}는 인라인 style 속성이라 style-src에 'unsafe-inline'이 필요.
# connect-src는 백엔드 주소(VITE_API_URL)가 빌드 시점 값이라 호스트를 못 박지 못해 스킴만 제한한다.
# index.html이 Google Fonts를 쓴다 → style-src에 fonts.googleapis.com, font-src에 fonts.gstatic.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
